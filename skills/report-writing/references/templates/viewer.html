<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — {{SITE_TITLE}}</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; background: var(--surface-2); }

    header { flex-shrink: 0; }
    .header-content { padding: 0.625rem 1.25rem; gap: 1rem; flex-wrap: wrap; }

    .viewer-title {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9375rem;
      color: var(--text);
    }

    .viewer-tag {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .viewer-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--font-sans);
      font-weight: 500;
      color: var(--ink);
    }

    .actions { display: flex; gap: 0.5rem; align-items: center; }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.875rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-family: var(--font-sans);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .action-btn:hover {
      color: var(--ink);
      border-color: var(--border-strong);
      background: var(--surface-2);
      text-decoration: none;
    }

    .action-btn.primary {
      color: var(--text-inverse);
      background: var(--accent);
      border-color: var(--accent);
    }

    .action-btn.primary:hover {
      background: var(--ink-muted);
      border-color: var(--ink-muted);
      color: var(--text-inverse);
    }

    .pdf-container {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow: hidden;
      background: #4a4a52;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 720px) {
      .header-content { padding: 0.625rem 0.875rem; }
      .viewer-title-text { font-size: 0.875rem; }
      .action-btn .label { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <a href="index.html" class="nav-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <div class="viewer-title">
        <span class="viewer-tag">{{TAG}}</span>
        <span class="viewer-title-text">{{TITLE}}</span>
      </div>
      <div class="actions">
        <a href="pdfs/{{FILENAME}}.pdf" download class="action-btn primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="label">Download PDF</span>
        </a>
      </div>
    </div>
  </header>
  <div class="pdf-container">
    <iframe class="pdf-frame" src="pdfs/{{FILENAME}}.pdf#view=FitH" title="{{TITLE}}"></iframe>
  </div>
</body>
</html>
