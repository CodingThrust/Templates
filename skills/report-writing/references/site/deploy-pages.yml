name: Deploy site to GitHub Pages

on:
  push:
    # Adjust to the branch you publish from (commonly "main" or "dev").
    branches: ["main"]
    paths:
      - "docs/**"
      - "tools/build_site.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/templates/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install markdown pymdown-extensions

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Build site
        run: make build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
